<!doctype html>
<html lang="de-DE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kochassistent · Testmodus (neuer User)</title>
<style>
  :root{--paper:#f4f4f2;--card:#fff;--card2:#f6f6f4;--ink:#1b1d21;--muted:#6c717a;--line:#e4e4df;--line2:#eeeeea;
    --green:#3f9b2e;--green-bg:#e7f4e3;--green-ink:#2f7422;--blue:#3663c9;--blue-bg:#e9eefb;--blue-line:#c3d2f4;
    --orange:#c96f1b;--orange-bg:#fbefe0;--orange-line:#f0d3ac;--red:#cf463c;--red-bg:#fbe9e7;--red-line:#f2c4bf;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;}
  @media (prefers-color-scheme:dark){:root{--paper:#0d0f13;--card:#191c21;--card2:#14171c;--ink:#e8eaed;--muted:#969ca5;--line:#2a2e35;--line2:#23262c;
    --green:#6cc258;--green-bg:#182a13;--green-ink:#8ed67c;--blue:#7099f2;--blue-bg:#182137;--blue-line:#33487f;
    --orange:#eda152;--orange-bg:#33260f;--orange-line:#5c421f;--red:#ef6a60;--red-bg:#361a18;--red-line:#5e2b27;}}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;}
  .tbar{flex:0 0 auto;display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;background:color-mix(in oklab,var(--blue) 12%,var(--card));border-bottom:1px solid var(--line2);font:700 .74rem/1 var(--mono);color:var(--blue);}
  .tbar b{letter-spacing:.03em}
  .tbar .reset{margin-left:auto;font:700 .74rem/1 var(--sans);border:1px solid var(--blue-line);background:var(--card);color:var(--blue);border-radius:999px;padding:.35rem .7rem;cursor:pointer;}
  .app{flex:1;min-height:0;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;}
  .head{display:flex;gap:.4rem;padding:.5rem .9rem;flex-wrap:wrap;}
  .oc{font:700 .63rem/1 var(--mono);padding:.26rem .48rem;border-radius:999px;background:var(--card2);color:var(--muted);border:1px solid var(--line2);}
  .oc.active{border-color:var(--blue);color:var(--blue);} .oc.done{background:var(--green-bg);color:var(--green-ink);border-color:transparent;} .oc.done::before{content:"✓ ";}
  .log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;padding:.7rem .9rem;}
  .msg{max-width:92%;padding:.6rem .72rem;border-radius:15px;font-size:.92rem;line-height:1.42;animation:in .28s cubic-bezier(.2,.75,.25,1) both;}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg.bot{align-self:flex-start;background:var(--card2);border:1px solid var(--line2);border-bottom-left-radius:5px;}
  .msg.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:5px;font-weight:600;}
  .msg.typing{display:inline-flex;align-self:flex-start;gap:.28rem;} .msg.typing span{width:.46rem;height:.46rem;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
  .msg.typing span:nth-child(2){animation-delay:.15s}.msg.typing span:nth-child(3){animation-delay:.3s}@keyframes bl{0%,70%,100%{opacity:.3}35%{opacity:.9}}
  .ctrl{margin-top:.55rem;display:flex;flex-direction:column;gap:.5rem;}
  .chips{display:flex;flex-wrap:wrap;gap:.4rem;}
  .chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.86rem;font-weight:600;padding:.34rem .6rem;border-radius:999px;border:1px solid var(--line);background:var(--card);}
  .chip .x{opacity:.5;font-weight:800;cursor:pointer;} .chip.d{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue);}
  .chip.sug{border-style:dashed;color:var(--muted);background:none;cursor:pointer;} .chip.sug.sel{border-style:solid;font-weight:700;}
  .chip.sug.h.sel{border-color:var(--red-line);background:var(--red-bg);color:var(--red);} .chip.sug.g.sel{border-color:var(--blue-line);background:var(--blue-bg);color:var(--blue);}
  .chip.sug.sel::after{content:"✓";margin-left:.28rem;font-weight:800;}
  .nameadd{display:flex;gap:.45rem;} .nameadd input{flex:1;font:600 .95rem/1 var(--sans);padding:.6rem .7rem;border-radius:11px;border:1.5px solid var(--blue-line);background:var(--card);color:var(--ink);}
  .nameadd .add{background:var(--blue);color:#fff;border:none;border-radius:11px;padding:0 1rem;font-weight:800;font-size:1.15rem;cursor:pointer;}
  .go{align-self:flex-start;font:700 .84rem/1 var(--sans);padding:.5rem .85rem;border-radius:10px;border:1px solid var(--blue-line);background:var(--blue-bg);color:var(--blue);cursor:pointer;} .go[disabled]{opacity:.45;cursor:default;}
  table.mx{border-collapse:collapse;font-size:.82rem;} table.mx th{font:700 .64rem/1 var(--mono);color:var(--muted);padding:.2rem;} table.mx td{padding:.22rem;text-align:center;} table.mx td:first-child{text-align:left;font-weight:700;white-space:nowrap;}
  .c{width:1.7rem;height:1.7rem;border-radius:8px;display:inline-block;background:var(--green);cursor:pointer;} .c.off{background:var(--card2);border:1px solid var(--line);}
  .sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem;margin:.2rem 0;}
  .sum h3{margin:0 0 .4rem;} .sum .row{font-size:.88rem;margin:.25rem 0;} .sum .row b{color:var(--muted);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em;display:block;}
  .restart{width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:.8rem;font:800 1rem/1 var(--sans);cursor:pointer;margin-top:.6rem;}
  .inbar{flex:0 0 auto;display:flex;gap:.4rem;padding:.55rem .9rem calc(.55rem + env(safe-area-inset-bottom));border-top:1px solid var(--line2);max-width:560px;width:100%;margin:0 auto;}
  .inbar input{flex:1;font:inherit;font-size:.92rem;padding:.62rem .72rem;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);}
  .inbar input:disabled{opacity:.5} .inbar .snd{background:var(--green);color:#fff;border:none;border-radius:12px;padding:0 1rem;font-weight:800;font-size:1.15rem;cursor:pointer;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <div class="tbar"><span>🧪 <b>TESTMODUS</b> · neuer User · nichts wird echt gespeichert</span><button class="reset" id="reset">🔄 Neu starten</button></div>
  <div class="app">
    <div class="head">
      <span class="oc" data-oc="1">👤 Wer</span><span class="oc" data-oc="2">⛔ No-Gos</span><span class="oc" data-oc="3">🎯 Wichtig</span><span class="oc" data-oc="4">🗓️ Rhythmus</span>
    </div>
    <div class="log" id="log"></div>
  </div>
  <div class="inbar"><input id="text" placeholder="Antworten oder erzählen …" aria-label="Nachricht"><button class="snd" id="send">→</button></div>

<script>
(function(){
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var log=document.getElementById('log'),input=document.getElementById('text'),sendBtn=document.getElementById('send');
  var DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];
  var state={persons:[],nogos:[],grund:[],rhythm:{}}, curHandler=null, advanceFn=null, busy=false;
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
  function scr(){log.scrollTo?log.scrollTo({top:log.scrollHeight,behavior:reduce?'auto':'smooth'}):log.scrollTop=log.scrollHeight;}
  function wait(ms,fn){setTimeout(fn,reduce?0:ms);}
  function me(t){var d=document.createElement('div');d.className='msg me';d.textContent=t;log.appendChild(d);scr();}
  function typing(){var d=document.createElement('div');d.className='msg bot typing';d.innerHTML='<span></span><span></span><span></span>';log.appendChild(d);scr();return d;}
  function head(n,st){var el=document.querySelector('.oc[data-oc="'+n+'"]');if(el){el.classList.remove('active','done');if(st)el.classList.add(st);}}
  function ask(htmlStr,build,opts){busy=true;curHandler=null;advanceFn=null;var t=typing();
    wait(560+Math.floor(Math.random()*260),function(){t.remove();var b=document.createElement('div');b.className='msg bot';b.innerHTML=htmlStr;log.appendChild(b);scr();
      if(build){wait(reduce?0:240,function(){var c=document.createElement('div');c.className='ctrl';b.appendChild(c);build(b,c);scr();busy=false;if(opts&&opts.focus)input.focus();});}
      else{busy=false;if(opts&&opts.then)wait(reduce?0:750,opts.then);}});}
  function wireSug(c){c.querySelectorAll('.chip.sug').forEach(function(x){x.addEventListener('click',function(){x.classList.toggle('sel');});});}
  function sel(c){return [].slice.call(c.querySelectorAll('.chip.sug.sel')).map(function(x){return x.textContent.trim();});}

  function stepIntro(){ask('Hi! 🧑‍🍳 Ich bin euer <b>Küchenassistent</b>.<br>Von <b>„Was gibt’s diese Woche?"</b> bis zur fertigen <b>Einkaufsliste</b> nehm ich euch alles ab — <b>gekocht wird bei euch.</b>',null,{then:stepPersons});}
  function stepPersons(){head(1,'active');
    ask('Damit das passt, lernen wir uns kurz kennen. 👋<br><b>Wer kocht &amp; isst mit?</b>',function(b,c){
      c.innerHTML='<div class="chips" data-list></div><div class="nameadd"><input placeholder="Name eingeben (z. B. du)"><button class="add">＋</button></div><button class="go" data-go disabled>Passt ›</button>';
      var list=c.querySelector('[data-list]'),nm=c.querySelector('input'),go=c.querySelector('[data-go]');
      function rp(){list.innerHTML=state.persons.map(function(n,i){return '<span class="chip d">'+(i===0?'🧑 ':'👤 ')+esc(n)+' <span class="x" data-rm="'+i+'">✕</span></span>';}).join('');
        list.querySelectorAll('[data-rm]').forEach(function(x){x.addEventListener('click',function(){state.persons.splice(+x.getAttribute('data-rm'),1);rp();});});
        go.disabled=!state.persons.length;go.textContent=state.persons.length?('Weiter mit '+state.persons.join(' & ')+' ›'):'Passt ›';}
      function addN(v){(v||'').split(/,| und | & |&|\//i).map(function(s){return s.replace(/^(ich bin|wir sind|und)\s+/i,'').trim();}).filter(Boolean).forEach(function(n){state.persons.push(n);});rp();}
      c.querySelector('.add').addEventListener('click',function(){addN(nm.value);nm.value='';nm.focus();});
      nm.addEventListener('keydown',function(e){if(e.key==='Enter'){addN(nm.value);nm.value='';}});
      go.addEventListener('click',function(){if(!state.persons.length||busy)return;me(state.persons.join(' & '));head(1,'done');stepNogos();});
      curHandler=function(t){addN(t);};advanceFn=function(){go.click();};rp();
    },{focus:true});}
  function stepNogos(){head(2,'active');var o=['🥜 Nüsse','🌾 Gluten','🥛 Laktose','🥗 vegetarisch','🌱 vegan'];
    ask('Super, <b>'+esc(state.persons.join(' & '))+'</b> ✓<br>Gibt’s <b>harte No-Gos?</b> <span style="color:var(--muted)">(Allergien / Ernährung)</span>',function(b,c){
      c.innerHTML='<div class="chips">'+o.map(function(x){return '<span class="chip sug h">'+x+'</span>';}).join('')+'</div><button class="go" data-go>Keine / Weiter ›</button>';
      wireSug(c);var go=c.querySelector('[data-go]');
      go.addEventListener('click',function(){if(busy)return;state.nogos=sel(c);me(state.nogos.join(', ')||'keine No-Gos');head(2,'done');stepGrund();});
      curHandler=function(t){var s=document.createElement('span');s.className='chip sug h sel';s.textContent='✨ '+t;s.addEventListener('click',function(){s.classList.toggle('sel');});c.querySelector('.chips').appendChild(s);me(t);};
      advanceFn=function(){go.click();};});}
  function stepGrund(){head(3,'active');var o=['🥦 viel Gemüse','💪 proteinreich','⚡ wenig Aufwand','🥩 wenig Fleisch','🔄 abwechslungsreich'];
    ask('Und was ist euch beim Essen <b>wichtig?</b> Tipp an oder erzähl.',function(b,c){
      c.innerHTML='<div class="chips">'+o.map(function(x){return '<span class="chip sug g">'+x+'</span>';}).join('')+'</div><button class="go" data-go>Weiter ›</button>';
      wireSug(c);var go=c.querySelector('[data-go]');
      go.addEventListener('click',function(){if(busy)return;state.grund=sel(c);me(state.grund.join(', ')||'—');head(3,'done');stepRhythm();});
      curHandler=function(t){var s=document.createElement('span');s.className='chip sug g sel';s.textContent='✨ '+t;s.addEventListener('click',function(){s.classList.toggle('sel');});c.querySelector('.chips').appendChild(s);me(t);};
      advanceFn=function(){go.click();};});}
  function stepRhythm(){head(4,'active');var names=state.persons.length?state.persons:['Du'];
    var h='<tr><th></th>'+DOW.map(function(d){return '<th>'+d+'</th>';}).join('')+'</tr>';
    var rows=names.map(function(n,i){return '<tr><td>'+(i===0?'🧑 ':'👤 ')+esc(n)+'</td>'+DOW.map(function(){return '<td><span class="c"></span></td>';}).join('')+'</tr>';}).join('');
    ask('Fast fertig! <b>Wer ist abends typischerweise da?</b> Tippen = da/weg.',function(b,c){
      c.innerHTML='<table class="mx">'+h+rows+'</table><button class="go" data-go>Fertig ✓</button>';
      c.querySelectorAll('.c').forEach(function(x){x.addEventListener('click',function(){x.classList.toggle('off');});});
      var go=c.querySelector('[data-go]');
      go.addEventListener('click',function(){if(busy)return;
        [].slice.call(c.querySelectorAll('table.mx tr')).slice(1).forEach(function(tr,ri){var nm=names[ri];state.rhythm[nm]=[].slice.call(tr.querySelectorAll('.c')).map(function(cell,ci){return cell.classList.contains('off')?null:DOW[ci];}).filter(Boolean);});
        me('Rhythmus gesetzt');head(4,'done');stepDone();});
      curHandler=function(t){me(t);};advanceFn=function(){go.click();};});}
  function stepDone(){
    ask('🎉 <b>Startklar!</b> So sieht euer neuer Haushalt aus:',function(b,c){
      function chips(arr,cls){return (arr&&arr.length)?arr.map(function(x){return '<span class="chip '+(cls||'')+'" style="font-size:.8rem">'+esc(x)+'</span>';}).join(' '):'<span style="color:var(--muted)">—</span>';}
      var rhythm=Object.keys(state.rhythm).map(function(n){return '<div class="row">'+esc(n)+': '+(state.rhythm[n].join(' · ')||'nie')+'</div>';}).join('');
      c.innerHTML='<div class="sum"><h3>👤 Personen</h3><div class="chips">'+chips(state.persons,'d')+'</div>'
        +'<div class="row" style="margin-top:.5rem"><b>⛔ Harte No-Gos</b>'+chips(state.nogos)+'</div>'
        +'<div class="row" style="margin-top:.5rem"><b>🎯 Grundsätze</b>'+chips(state.grund)+'</div>'
        +'<div class="row" style="margin-top:.5rem"><b>🗓️ Wer ist wann da</b>'+(rhythm||'—')+'</div>'
        +'<button class="restart" id="again">🔄 Als neuer User neu starten</button></div>'
        +'<div style="color:var(--muted);font-size:.8rem;text-align:center;margin-top:.4rem">Testmodus – keine echten Daten geändert.</div>';
      c.querySelector('#again').addEventListener('click',reset);
      input.disabled=true;sendBtn.disabled=true;input.placeholder='Test abgeschlossen – oben „Neu starten"';});}

  function sendText(){if(busy)return;var v=(input.value||'').trim();if(!v){if(advanceFn)advanceFn();return;}if(curHandler)curHandler(v);input.value='';scr();}
  function reset(){log.innerHTML='';state={persons:[],nogos:[],grund:[],rhythm:{}};curHandler=null;advanceFn=null;busy=false;
    input.disabled=false;sendBtn.disabled=false;input.placeholder='Antworten oder erzählen …';['1','2','3','4'].forEach(function(n){head(n,'');});stepIntro();}
  document.getElementById('reset').addEventListener('click',reset);
  sendBtn.addEventListener('click',sendText);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();sendText();}});
  stepIntro();
})();
</script>
</body>
</html>
